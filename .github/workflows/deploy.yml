name: Legacy GitHub Pages (manual rollback only)

# The live domain is on EdgeOne. Keep the old hosting as an explicit fallback,
# rather than publishing a second site on every main push.
on:
  workflow_dispatch:
    inputs:
      confirm_restore:
        description: 'Explicitly rebuild the legacy GitHub Pages fallback'
        type: boolean
        required: true
        default: false

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ inputs.confirm_restore }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: chaojifeishu.xyz
