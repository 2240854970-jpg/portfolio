<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 — 作品集</title>
  <style>
    /* Admin overlay styles — keep lightweight */
    /* Clickable area highlight */
    [data-editable] { cursor:pointer; position:relative; transition:outline .15s; }
    [data-editable]:hover { outline:1px dashed rgba(192,132,252,.35); outline-offset:2px; border-radius:4px; }
    body.edit-mode [data-editable]:hover { outline-color:rgba(192,132,252,.55); }

    /* Admin entry button */
    .admin-entry-fab { position:fixed; bottom:20px; left:20px; z-index:99999; width:40px; height:40px; border-radius:50%;
      background:rgba(192,132,252,.15); border:1px solid rgba(192,132,252,.25); color:#c084fc; font-size:16px;
      cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:.5; transition:all .3s; }
    .admin-entry-fab:hover { opacity:1; background:rgba(192,132,252,.25); }

    /* Top bar */
    .admin-bar { position:sticky; top:0; z-index:99990; display:flex; align-items:center; justify-content:space-between;
      padding:10px 24px; background:rgba(10,10,10,.92); backdrop-filter:blur(20px); border-bottom:1px solid rgba(192,132,252,.08); }
    .admin-bar-logo { font-family:'Space Grotesk','Noto Sans SC',sans-serif; font-size:15px; color:#c084fc; font-weight:600; }
    .admin-bar-tabs { display:flex; gap:2px; }
    .admin-bar-tab { padding:8px 18px; border-radius:8px; font-size:13px; color:#888; background:transparent; border:none; cursor:pointer; transition:all .2s; }
    .admin-bar-tab:hover { color:#ddd; }
    .admin-bar-tab.active { color:#c084fc; background:rgba(192,132,252,.08); }
    .admin-bar-save { padding:8px 20px; border:none; border-radius:8px; background:#22c55e; color:#000; font-weight:700; font-size:13px; cursor:pointer; }
    .admin-bar-save:hover { opacity:.85; }
    .admin-bar-status { font-size:12px; color:#888; margin-right:12px; }

    /* Edit modal overlay — reuse admin.css modal classes but customize */
    .ae-overlay { position:fixed; inset:0; z-index:99995; background:rgba(0,0,0,.75); backdrop-filter:blur(8px);
      display:none; align-items:center; justify-content:center; }
    .ae-overlay.open { display:flex; }
    .ae-modal { width:100%; max-width:580px; max-height:80vh; overflow-y:auto; padding:28px; border-radius:16px;
      border:1px solid rgba(255,255,255,.08); background:#0f0f0f; }
    .ae-modal h3 { font-family:'Space Grotesk','Noto Sans SC',sans-serif; font-size:20px; margin-bottom:20px; color:#c084fc; }
    .ae-field { margin-bottom:14px; }
    .ae-field label { display:block; font-size:12px; color:#888; margin-bottom:4px; letter-spacing:.04em; }
    .ae-field input, .ae-field textarea, .ae-field select {
      width:100%; padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04); color:#f0f0f0; font-size:13px; outline:none; box-sizing:border-box; }
    .ae-field textarea { resize:vertical; min-height:80px; }
    .ae-field input:focus, .ae-field textarea:focus { border-color:#c084fc; }
    .ae-actions { display:flex; gap:8px; margin-top:20px; }
    .ae-btn { padding:10px 24px; border-radius:8px; border:none; font-size:14px; font-weight:600; cursor:pointer; }
    .ae-btn-primary { background:#c084fc; color:#000; }
    .ae-btn-cancel { background:rgba(255,255,255,.06); color:#888; }
    .ae-btn-delete { background:transparent; color:#ef4444; border:1px solid #ef4444; }
    .ae-btn-sm { padding:4px 10px; border-radius:4px; border:1px solid rgba(255,255,255,.08); background:transparent; color:#888; font-size:11px; cursor:pointer; }
    .ae-btn-sm:hover { border-color:#c084fc; color:#c084fc; }
    .ae-btn-sm.danger:hover { border-color:#ef4444; color:#ef4444; }

    /* Page panels */
    .admin-page { display:none; }
    .admin-page.active { display:block; }

    /* File upload */
    .file-grid { display:flex; flex-wrap:wrap; gap:10px; }
    .file-item { text-align:center; }
    .file-item img, .file-item video { width:110px; height:110px; object-fit:cover; border-radius:8px; border:1px solid rgba(255,255,255,.08); }
    .file-item .fn { font-size:11px; color:#888; margin-top:4px; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
    .file-item .fn:hover { color:#c084fc; text-decoration:underline; }

    /* Toast */
    .admin-toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); z-index:99999; padding:10px 24px;
      border-radius:8px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; }
    .admin-toast.show { opacity:1; pointer-events:auto; }
    .admin-toast { background:#1a1a2a; color:#ddd; border:1px solid #333; }
    .admin-toast.success { border-color:#22c55e; color:#22c55e; }
    .admin-toast.error { border-color:#ef4444; color:#ef4444; }

    /* Hide admin elements on public site */
    .admin-entry-fab, .admin-bar { display:none; }
    body.logged-in .admin-entry-fab { display:none; }
    body.logged-in .admin-bar { display:flex; }
    body:not(.logged-in) .admin-entry-fab { display:flex; }
  </style>
  <link rel="stylesheet" crossorigin href="/assets/admin-Wgw2DwaS.css">
  <link rel="stylesheet" crossorigin href="/assets/style-7sLpRoMq.css">
</head>

  <!-- ====== PAGE: Home ====== -->

    <!-- Hero -->
    <section class="hero" style="height:auto;min-height:60vh;padding:80px 0">

          <h1 class="hero-title" style="overflow:visible">

            <span class="hero-line" style="font-size:0.45em;font-weight:400;letter-spacing:.04em">
              <span data-editable data-path="title" data-label="职位">—</span>
            </span>
          </h1>
          <p class="hero-sub" style="opacity:1;transform:none">

    <!-- Highlights -->

    <!-- Contact -->

  <!-- ====== Toast ====== -->
  <div class="admin-toast" id="admin-toast"></div>

  <script>
    const OWNER='2240854970-jpg', REPO='portfolio', DATA_PATH='src/data/site-data.js', IMG_DIR='public/images/', BRANCH='main';
    let siteData=null, dataSha='', gitToken='', dirty=false, editTarget=null, currentPage='home';

    // ── GitHub API ──
    async function ghGet(path){
      const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{
        headers:{'Authorization':`Bearer ${gitToken}`,'Accept':'application/vnd.github+json'}
      }); return r.ok?await r.json():null;
    }
    async function ghPut(path,content,msg,sha){
      const b64=btoa(unescape(encodeURIComponent(content)));
      const body={message:msg,content:b64,branch:BRANCH}; if(sha) body.sha=sha;
      const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{
        method:'PUT',headers:{'Authorization':`Bearer ${gitToken}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
        body:JSON.stringify(body)
      }); return r.ok?await r.json():null;
    }
    async function ghListDir(path){
      const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{
        headers:{'Authorization':`Bearer ${gitToken}`,'Accept':'application/vnd.github+json'}
      }); return r.ok?await r.json():[];
    }
    function d64(b64){try{return decodeURIComponent(escape(atob(b64)));}catch{return atob(b64);}}

    // ── Parse ──
    function parseData(raw){
      const m=raw.match(/export const siteData\s*=\s*({[\s\S]*?})\n\s*(?:export|$)/);
      if(!m) return null;
      try{return new Function('return '+m[1])();}catch(e){return null;}
    }
    function getByPath(obj,p){return p.split('.').reduce((o,k)=>o?.[k],obj);}
    function setByPath(obj,p,val){const k=p.split('.');let o=obj;for(let i=0;i<k.length-1;i++){if(!o[k[i]]) o[k[i]]={};o=o[k[i]];}o[k[k.length-1]]=val;}

    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

    // ── Login ──
    async function adminLogin(){
      gitToken=document.getElementById('admin-token').value;
      const pwd=document.getElementById('admin-pwd').value;
      const resp=await ghGet(DATA_PATH);
      if(!resp){toast('无法连接 GitHub','error');return;}
      const raw=d64(resp.content); dataSha=resp.sha;
      const sd=parseData(raw);
      if(!sd||sd.adminPassword!==pwd){document.getElementById('admin-error').style.display='block';return;}
      siteData=sd;
      document.getElementById('login-modal').classList.remove('open');
      document.body.classList.add('logged-in');
      renderAll();
    }

    // ── Render Everything ──
    function renderAll(){
      const d=siteData;
      // Fill all [data-editable] spans
      document.querySelectorAll('[data-editable]').forEach(el=>{
        const path=el.dataset.path;
        const val=getByPath(d,path);
        if(val!==undefined && val!==null) el.textContent=typeof val==='string'?val:String(val);
      });
      // Render dynamic lists
      renderHomeStats();
      renderHomeHighlights();
      renderHomeFeatured();
      renderHomeSocials();
      renderWorksGrid();
      renderAboutSkills();
      renderAboutExperience();
      renderAboutAchievements();
      renderAboutTestimonials();
    }

    // ── Home Stats ──
    function renderHomeStats(){
      const arr=siteData.stats||[];
      document.getElementById('home-stats').innerHTML=arr.map((s,i)=>`
        <div class="stat-item" style="opacity:1;transform:none">
          <span class="stat-icon">${esc(s.icon)}</span>
          <span class="stat-value" data-editable data-path="stats.${i}.value" data-label="数据条值">${esc(s.value)}</span>
          <span class="stat-label" data-editable data-path="stats.${i}.label" data-label="数据条描述">${esc(s.label)}</span>
          <button class="ae-btn-sm danger" onclick="delArr('stats',${i})" style="position:absolute;top:4px;right:8px" title="删除">✕</button>
        </div>`).join('')+`<button class="ae-btn-sm" onclick="addItem('stats')" style="margin-left:8px">+ 添加</button>`;
    }

    // ── Home Highlights ──
    function renderHomeHighlights(){
      const arr=siteData.highlights||[];
      document.getElementById('home-highlights').innerHTML=arr.map((h,i)=>`
        <div class="highlight-card">
          <span class="highlight-icon">${esc(h.icon)}</span>
          <h3 class="highlight-title" data-editable data-path="highlights.${i}.label" data-label="亮点标题">${esc(h.label)}</h3>
          <p class="highlight-desc" data-editable data-path="highlights.${i}.desc" data-label="亮点描述">${esc(h.desc)}</p>
          <div style="margin-top:8px"><button class="ae-btn-sm danger" onclick="delArr('highlights',${i})">✕ 删除</button></div>
        </div>`).join('')+`<div class="highlight-card" style="display:flex;align-items:center;justify-content:center;border:1px dashed #333"><button class="ae-btn-sm" onclick="addItem('highlights')">+ 添加</button></div>`;
    }

    // ── Home Featured ──
    function renderHomeFeatured(){
      const ids=siteData.featuredWorkIds||[];
      const works=siteData.works||[];
      const featured=ids.map(id=>works.find(w=>w.id===id)).filter(Boolean);
      document.getElementById('home-featured').innerHTML=featured.map(w=>{
        const img=w.images&&w.images[0]?w.images[0]:w.thumbnail;
        return `<div class="work-card-item" style="border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden;background:#0f0f0f">
          ${img?`<img src="${esc(img)}" style="width:100%;height:200px;object-fit:cover" onerror="this.src=''" />`:''}
          <div style="padding:12px"><h4 style="font-size:14px;color:#ddd">${esc(w.title)}</h4><p style="font-size:12px;color:#888">${esc(w.category)}</p></div>
        </div>`;
      }).join('')||'<p style="color:#888;font-size:13px">暂无精选作品。在上方编辑栏处点击编辑精选作品 ID。</p>';
      // Also make featuredWorkIds editable
      const el=document.querySelector('[data-path="featuredWorkIds"]');
      if(el) el.textContent='精选 ID: '+(ids.join(', ')||'无');
    }
    // Expose featuredWorkIds editing via a button
    (function(){
      const wrap=document.getElementById('home-featured').parentElement;
      if(!document.getElementById('edit-featured-btn')){
        const btn=document.createElement('button');
        btn.id='edit-featured-btn'; btn.className='ae-btn-sm'; btn.textContent='✎ 编辑精选作品ID';
        btn.style.cssText='margin-bottom:12px';
        btn.onclick=()=>openEdit('featuredWorkIds','精选作品ID',(siteData.featuredWorkIds||[]).join(', '),true,()=>{
          siteData.featuredWorkIds=document.getElementById('edit-val').value.split(',').map(s=>s.trim()).filter(Boolean);
          markDirty(); renderHomeFeatured();
        });
        wrap.insertBefore(btn,document.getElementById('home-featured'));
      }
    })();

    // ── Home Socials ──
    function renderHomeSocials(){
      document.getElementById('home-socials').innerHTML=(siteData.socials||[]).map((s,i)=>`
        <a class="social-link" style="cursor:pointer">${esc(s.name)}</a>
      `).join('');
    }

    // ── Works Grid ──
    function renderWorksGrid(){
      const arr=siteData.works||[];
      document.getElementById('works-grid').innerHTML=arr.map((w,i)=>{
        const img=w.images&&w.images[0]?w.images[0]:w.thumbnail;
        return `<div class="work-card-item" style="border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden;background:#0f0f0f;position:relative">
          ${img?`<img src="${esc(img)}" style="width:100%;height:180px;object-fit:cover" onerror="this.src=''" />`:`<div style="width:100%;height:120px;background:#1a1a2a;display:flex;align-items:center;justify-content:center;color:#444;font-size:24px">🖼</div>`}
          <div style="padding:12px">
            <h4 style="font-size:15px;color:#ddd;margin-bottom:4px">${esc(w.title)}</h4>
            <p style="font-size:12px;color:#888;margin-bottom:2px">${esc(w.category)} · ${esc(w.date)}</p>
            <p style="font-size:11px;color:#666">${esc(w.type||'image')} | ${(w.images||[]).length}张图</p>
          </div>
          <div style="position:absolute;top:8px;right:8px;display:flex;gap:4px">
            <button class="ae-btn-sm" onclick="editWork(${i})" style="background:rgba(0,0,0,.6)">✎</button>
            <button class="ae-btn-sm danger" onclick="delArr('works',${i})" style="background:rgba(0,0,0,.6)">✕</button>
          </div>
        </div>`;
      }).join('');
    }

    // ── About Skills ──
    function renderAboutSkills(){
      const arr=(siteData.about||{}).skills||[];
      document.getElementById('about-skills').innerHTML=arr.map((s,i)=>`
        <div style="margin-bottom:12px;padding:8px 12px;background:#0f0f0f;border-radius:8px;border:1px solid rgba(255,255,255,.04)">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <span>${esc(s.name)}</span><span style="color:#c084fc">${Math.round((s.level||0)*100)}%</span>
          </div>
          <div style="height:4px;background:#1a1a2a;border-radius:2px"><div style="height:100%;background:#c084fc;border-radius:2px;width:${Math.round((s.level||0)*100)}%"></div></div>
          <div style="margin-top:4px"><button class="ae-btn-sm" onclick="editArrItem('about.skills',${i},['name','level'])">✎</button> <button class="ae-btn-sm danger" onclick="delArr('about.skills',${i})">✕</button></div>
        </div>`).join('')+`<button class="ae-btn-sm" onclick="addItem('about.skills')">+ 添加技能</button>`;
    }

    // ── About Experience ──
    function renderAboutExperience(){
      const arr=(siteData.about||{}).experience||[];
      document.getElementById('about-experience').innerHTML=arr.map((e,i)=>`
        <div style="padding:16px;background:#0f0f0f;border-radius:10px;border:1px solid rgba(255,255,255,.04);margin-bottom:12px;position:relative">
          <span style="font-size:12px;color:#c084fc">${esc(e.period)}</span>
          <h4 style="font-size:15px;color:#ddd;margin:4px 0">${esc(e.role)} · ${esc(e.company)}</h4>
          <p style="font-size:13px;color:#888;line-height:1.6">${esc(e.desc||'')}</p>
          <div style="margin-top:8px"><button class="ae-btn-sm" onclick="editArrItem('about.experience',${i},['period','company','role','desc'])">✎</button> <button class="ae-btn-sm danger" onclick="delArr('about.experience',${i})">✕</button></div>
        </div>`).join('')+`<button class="ae-btn-sm" onclick="addItem('about.experience')">+ 添加经历</button>`;
    }

    // ── About Achievements ──
    function renderAboutAchievements(){
      const arr=(siteData.about||{}).achievements||[];
      document.getElementById('about-achievements').innerHTML=arr.map((a,i)=>`
        <div style="padding:16px;background:#0f0f0f;border-radius:10px;border:1px solid rgba(255,255,255,.04);margin-bottom:12px;position:relative">
          <span style="font-size:20px">${esc(a.icon)}</span>
          <h4 style="font-size:15px;color:#ddd;margin:6px 0 4px">${esc(a.title)} <span style="font-size:11px;color:#888">${esc(a.year)}</span></h4>
          <p style="font-size:13px;color:#888;line-height:1.6">${esc(a.desc||'')}</p>
          <div style="margin-top:8px"><button class="ae-btn-sm" onclick="editArrItem('about.achievements',${i},['icon','title','year','desc'])">✎</button> <button class="ae-btn-sm danger" onclick="delArr('about.achievements',${i})">✕</button></div>
        </div>`).join('')+`<button class="ae-btn-sm" onclick="addItem('about.achievements')">+ 添加成就</button>`;
    }

    // ── About Testimonials ──
    function renderAboutTestimonials(){
      const arr=(siteData.about||{}).testimonials||[];
      document.getElementById('about-testimonials').innerHTML=arr.map((t,i)=>`
        <div style="padding:16px;background:#0f0f0f;border-radius:10px;border:1px solid rgba(255,255,255,.04);margin-bottom:12px;position:relative">
          <p style="font-size:14px;color:#ddd;line-height:1.7;font-style:italic">"${esc(t.quote||'')}"</p>
          <p style="font-size:12px;color:#888;margin-top:8px">— ${esc(t.author)} ${t.role?esc(t.role):''}</p>
          <div style="margin-top:8px"><button class="ae-btn-sm" onclick="editArrItem('about.testimonials',${i},['quote','author','role'])">✎</button> <button class="ae-btn-sm danger" onclick="delArr('about.testimonials',${i})">✕</button></div>
        </div>`).join('')+`<button class="ae-btn-sm" onclick="addItem('about.testimonials')">+ 添加评价</button>`;
    }

    // ── Edit System ──
    document.addEventListener('click',e=>{
      const el=e.target.closest('[data-editable]');
      if(!el||!el.dataset.path) return;
      const path=el.dataset.path;
      const val=getByPath(siteData,path);
      const label=el.dataset.label||path;
      const isLong=typeof val==='string'&&val.length>60;
      openEdit(path,label,val!==undefined?String(val):'',isLong,null);
    });
    // Also re-bind after dynamic render
    function rebindEditable(){
      // Already handled by event delegation on document
    }

    function openEdit(path,label,currentValue,isLong,customSave){
      editTarget={path:path,label:label,customSave:customSave};
      document.getElementById('edit-title').textContent='编辑 — '+label;
      document.getElementById('edit-body').innerHTML=`
        <div class="ae-field"><label>${label}</label>
        ${isLong?`<textarea id="edit-val" rows="6">${esc(currentValue)}</textarea>`:`<input id="edit-val" value="${esc(currentValue)}" />`}
        </div>`;
      document.getElementById('edit-modal').classList.add('open');
    }
    function saveEdit(){
      if(!editTarget) return;
      const val=document.getElementById('edit-val').value;
      if(editTarget.customSave){
        editTarget.customSave(val);
      }else{
        const path=editTarget.path;
        // Try number conversion for level fields
        if(path.endsWith('.level')) setByPath(siteData,path,parseFloat(val)||0);
        else setByPath(siteData,path,val);
        markDirty();
        renderAll();
      }
      closeEdit();
    }
    function closeEdit(){
      document.getElementById('edit-modal').classList.remove('open');
      editTarget=null;
    }

    // ── Array CRUD ──
    function delArr(path,index){
      const arr=getByPath(siteData,path);
      if(!arr) return;
      const name=arr[index]?.title||arr[index]?.label||arr[index]?.name||('项#'+(index+1));
      if(!confirm('删除「'+name+'」？')) return;
      arr.splice(index,1);
      markDirty(); renderAll();
    }
    function addItem(path){
      const defaults={
        stats:{value:'新数据',label:'描述',icon:'✦'},
        highlights:{icon:'✦',label:'新亮点',desc:'描述'},
        works:{id:'work-'+Date.now(),title:'新作品',category:'主图 / Banner 设计',type:'image',thumbnail:'',bgGrad:'linear-gradient(135deg,#1a2a3a,#6366f1)',images:[],videoUrl:'',brief:'',role:'',date:'2026.05',tools:[],achievement:'',designIntro:'',showCase:[],designResult:''},
        'about.skills':{name:'新技能',level:0.8},
        'about.experience':{period:'2025-至今',company:'公司名',role:'职位',desc:'描述'},
        'about.achievements':{icon:'✦',title:'新成就',year:'2025',desc:'描述'},
        'about.testimonials':{quote:'评价内容',author:'评价人',role:''},
        socials:{name:'平台',url:'#',icon:'✦'}
      };
      const arr=getByPath(siteData,path);
      if(!arr) return;
      arr.push(defaults[path]||{});
      markDirty(); renderAll();
    }
    function editArrItem(path,index,keys){
      const arr=getByPath(siteData,path);
      if(!arr||!arr[index]) return;
      let html='';
      keys.forEach(k=>{html+=`<div class="ae-field"><label>${k}</label><input id="ea-${k}" value="${esc(String(arr[index][k]||''))}" /></div>`;});
      document.getElementById('edit-title').textContent='编辑项目';
      document.getElementById('edit-body').innerHTML=html;
      document.getElementById('edit-modal').classList.add('open');
      editTarget={type:'arr',path:path,index:index,keys:keys};
    }
    // Override saveEdit for arr type
    const origSaveEdit=saveEdit;
    saveEdit=function(){
      if(editTarget&&editTarget.type==='arr'){
        const arr=getByPath(siteData,editTarget.path);
        editTarget.keys.forEach(k=>{
          const v=document.getElementById('ea-'+k).value;
          if(k==='level') arr[editTarget.index][k]=parseFloat(v)||0;
          else arr[editTarget.index][k]=v;
        });
        markDirty(); renderAll(); closeEdit();
        return;
      }
      origSaveEdit();
    };

    // ── Edit Work ──
    let editingWorkIdx=-1;
    function editWork(i){
      const w=siteData.works[i];
      if(!w) return;
      editingWorkIdx=i;
      let html='';
      [['id','ID'],['title','标题'],['category','分类'],['type','类型(image/video)'],
       ['date','日期'],['role','角色'],['thumbnail','缩略图'],
       ['brief','简介'],['achievement','成果'],['designIntro','设计思路'],['designResult','设计成果']].forEach(([k,l])=>{
        html+=`<div class="ae-field"><label>${l}</label><input id="ew-${k}" value="${esc(w[k]||'')}" /></div>`;
      });
      html+=`<div class="ae-field"><label>工具（逗号分隔）</label><input id="ew-tools" value="${esc((w.tools||[]).join(', '))}" /></div>`;
      html+=`<div class="ae-field"><label>图片路径（逗号分隔）</label><textarea id="ew-images" rows="2">${esc((w.images||[]).join(', '))}</textarea></div>`;
      html+=`<div style="font-size:12px;color:#888">ShowCase: ${(w.showCase||[]).length}项（文本编辑暂不支持，需手动改 site-data.js）</div>`;
      document.getElementById('edit-title').textContent='编辑作品';
      document.getElementById('edit-body').innerHTML=html;
      document.getElementById('edit-modal').classList.add('open');
      editTarget={type:'work',index:i};
    }
    // Extend saveEdit for work type
    const origSaveEdit2=saveEdit;
    saveEdit=function(){
      if(editTarget&&editTarget.type==='work'){
        const w=siteData.works[editTarget.index];
        ['id','title','category','type','date','role','thumbnail','brief','achievement','designIntro','designResult'].forEach(k=>{w[k]=document.getElementById('ew-'+k).value;});
        w.tools=document.getElementById('ew-tools').value.split(',').map(s=>s.trim()).filter(Boolean);
        w.images=document.getElementById('ew-images').value.split(',').map(s=>s.trim()).filter(Boolean);
        markDirty(); renderWorksGrid(); closeEdit();
        return;
      }
      origSaveEdit2();
    };
    function addWork(){
      siteData.works=siteData.works||[];
      siteData.works.push({id:'work-'+Date.now(),title:'新作品',category:'主图 / Banner 设计',type:'image',thumbnail:'',bgGrad:'linear-gradient(135deg,#1a2a3a,#6366f1)',images:[],videoUrl:'',brief:'',role:'',date:'2026.05',tools:[],achievement:'',designIntro:'',showCase:[],designResult:''});
      markDirty(); renderWorksGrid();
    }

    // ── Serialize ──
    function ser(obj,indent=0){
      const sp='  '.repeat(indent),sp2='  '.repeat(indent+1);
      if(obj===null) return 'null';
      if(typeof obj==='string') return "'"+obj.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n')+"'";
      if(typeof obj==='number'||typeof obj==='boolean') return String(obj);
      if(Array.isArray(obj)){
        if(obj.length===0) return '[]';
        if(obj.every(x=>typeof x!=='object'||x===null)) return '['+obj.map(x=>ser(x,0)).join(', ')+']';
        return '[\n'+obj.map(x=>sp2+ser(x,indent+1)).join(',\n')+'\n'+sp+']';
      }
      if(typeof obj==='object'){
        const keys=Object.keys(obj);
        if(keys.length===0) return '{}';
        return '{\n'+keys.map(k=>sp2+k+': '+ser(obj[k],indent+1)).join(',\n')+'\n'+sp+'}';
      }
      return String(obj);
    }

    async function saveAll(){
      const js='/**\n * ════════════════════════════════\n * ★ 站点内容数据 ★\n * 管理后台可视化编辑生成\n * ════════════════════════════════\n */\n\nexport const siteData = '+ser(siteData,0)+';\n';
      toast('保存中...');
      const result=await ghPut(DATA_PATH,js,'feat: 可视化编辑更新',dataSha);
      if(result){
        dataSha=result.content.sha; dirty=false;
        document.getElementById('dirty-status').textContent='已保存 ✓';
        document.getElementById('dirty-status').style.color='#22c55e';
        toast('✅ 保存成功！1-2分钟后网站自动更新','success');
      }else{toast('❌ 保存失败','error');}
    }
    function markDirty(){
      dirty=true;
      document.getElementById('dirty-status').textContent='● 有修改';
      document.getElementById('dirty-status').style.color='#f59e0b';
    }

    // ── Tab Switch ──
    document.querySelectorAll('.admin-bar-tab').forEach(tab=>{
      tab.addEventListener('click',()=>{
        document.querySelectorAll('.admin-bar-tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.admin-page').forEach(p=>p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('page-'+tab.dataset.page).classList.add('active');
        currentPage=tab.dataset.page;
      });
    });

    // ── Modal click-outside ──
    document.getElementById('edit-modal').addEventListener('click',e=>{
      if(e.target===e.currentTarget) closeEdit();
    });

    // ── File Upload ──
    let pendingFiles=[];
    function previewFiles(){
      pendingFiles=Array.from(document.getElementById('file-input').files);
      document.getElementById('file-preview').innerHTML=pendingFiles.map(f=>{
        const url=URL.createObjectURL(f), isV=f.type.startsWith('video/');
        return `<div style="text-align:center"><div style="width:80px;height:80px;overflow:hidden;border-radius:6px;border:1px solid #333">${isV?`<video src="${url}" style="width:100%;height:100%;object-fit:cover"></video>`:`<img src="${url}" style="width:100%;height:100%;object-fit:cover" />`}</div><div style="font-size:10px;color:#888;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</div></div>`;
      }).join('');
    }
    async function uploadFiles(){
      if(!pendingFiles.length){toast('请先选择文件','error');return;}
      toast('上传中...'); let ok=0;
      for(const f of pendingFiles){
        const b64=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result.split(',')[1]);rd.readAsDataURL(f);});
        const path=IMG_DIR+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        if(await ghPut(path,b64,'upload: '+f.name)) ok++; else toast('失败: '+f.name,'error');
      }
      if(ok){toast('✅ 成功 '+ok+' 个文件','success');pendingFiles=[];document.getElementById('file-preview').innerHTML='';document.getElementById('file-input').value='';loadFileList();}
    }
    async function loadFileList(){
      const files=await ghListDir(IMG_DIR);
      if(!Array.isArray(files)) return;
      document.getElementById('existing-files').innerHTML=files.filter(f=>f.type==='file').map(f=>{
        const isV=f.name.match(/\.(mp4|webm|mov)$/i);
        return `<div class="file-item">${isV?`<video src="${f.download_url}" style="width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,.08)"></video>`:`<img src="${f.download_url}" loading="lazy" />`}<div class="fn" title="点击复制" onclick="copyPath('images/${f.name}')">images/${f.name}</div></div>`;
      }).join('');
    }
    function copyPath(p){navigator.clipboard.writeText(p).then(()=>toast('已复制: '+p));}

    // ── Toast ──
    function toast(msg,type=''){
      const el=document.getElementById('admin-toast');
      el.textContent=msg; el.className='admin-toast '+type; el.classList.add('show');
      setTimeout(()=>el.classList.remove('show'),4000);
    }
  </script>
