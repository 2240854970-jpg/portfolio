<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 — 作品集</title>
  <link rel="stylesheet" crossorigin href="/assets/admin-Wgw2DwaS.css">
  <link rel="stylesheet" crossorigin href="/assets/style-7sLpRoMq.css">
</head>
<body style="background:#08080c;color:#ddd;font-family:'Noto Sans SC',sans-serif;margin:0">

<!-- ====== Login ====== -->
<div class="admin-modal-overlay" id="login-modal" style="display:flex">
  <div class="admin-modal">
    <h2>✦ 管理后台</h2>
    <p>登录后可视化编辑全站内容</p>
    <div class="form-group"><label>管理密码</label><input type="password" id="admin-pwd" placeholder="请输入密码" /></div>
    <div class="form-group"><label>GitHub Token</label><input type="password" id="admin-token" placeholder="ghp_..." /></div>
    <button class="btn" onclick="adminLogin()">登录</button>
    <div class="admin-error" id="admin-error">密码错误，请重试</div>
  </div>
</div>

<!-- ====== Main CMS ====== -->
<div id="cms-root" style="display:none">

  <!-- Top Bar -->
  <div id="cms-topbar">
    <span class="cms-logo">✦ 管理后台</span>
    <span id="dirty-badge" style="color:#888;font-size:13px">无修改</span>
    <button onclick="saveAll()" class="cms-save-btn">💾 保存并部署</button>
  </div>

  <!-- Main Layout -->
  <div id="cms-main">
    <!-- Left Tabs -->
    <div id="cms-sidebar">
      <button class="cms-tab active" data-tab="home">🏠 首页</button>
      <button class="cms-tab" data-tab="works">🖼 作品管理</button>
      <button class="cms-tab" data-tab="about">👤 关于我</button>
      <button class="cms-tab" data-tab="contact">📧 联系方式</button>
      <button class="cms-tab" data-tab="files">📁 文件上传</button>
    </div>

    <!-- Right Preview -->
    <div id="cms-preview">
      <!-- Home Tab -->
      <div class="cms-panel active" id="panel-home">
        <!-- Hero -->
        <div id="preview-hero" class="preview-section">
          <div class="preview-hero-inner">
            <h1 class="editable" data-path="name" style="font-size:48px;margin:0 0 4px;font-weight:700;letter-spacing:0.04em" id="pv-name">—</h1>
            <p class="editable" data-path="title" style="font-size:22px;margin:0 0 8px;color:#c084fc" id="pv-title">—</p>
            <p class="editable" data-path="tagline" style="font-size:15px;margin:0;color:#888" id="pv-tagline">—</p>
          </div>
        </div>

        <!-- Stats -->
        <div class="preview-section">
          <h2 class="section-label">📊 首页数据条</h2>
          <div id="preview-stats" class="stats-row"></div>
          <button class="add-btn" onclick="addItem('stats')">+ 添加数据条</button>
        </div>

        <!-- Highlights -->
        <div class="preview-section">
          <h2 class="section-label">✦ 核心价值</h2>
          <div id="preview-highlights" class="card-grid"></div>
          <button class="add-btn" onclick="addItem('highlights')">+ 添加</button>
        </div>

        <!-- Featured Works -->
        <div class="preview-section">
          <h2 class="section-label">📌 首页精选作品</h2>
          <div class="editable" data-path="featuredWorkIds" style="padding:8px 12px;background:#111;border-radius:6px;font-size:13px;color:#888;cursor:pointer" id="pv-featured">点击编辑精选作品 ID</div>
        </div>

        <!-- Footer -->
        <div class="preview-section">
          <h2 class="section-label">📄 页脚</h2>
          <div class="editable" data-path="footer" style="padding:8px 12px;background:#111;border-radius:6px;font-size:13px;color:#888;cursor:pointer" id="pv-footer">—</div>
        </div>
      </div>

      <!-- Works Tab -->
      <div class="cms-panel" id="panel-works">
        <div id="preview-works"></div>
        <button class="add-btn" onclick="addItem('works')" style="margin-top:16px">+ 新建作品</button>
      </div>

      <!-- About Tab -->
      <div class="cms-panel" id="panel-about">
        <div class="preview-section">
          <h2 class="section-label">📝 个人简介</h2>
          <div class="editable" data-path="about.bio1" style="padding:12px;background:#111;border-radius:6px;margin-bottom:8px;cursor:pointer;font-size:14px;line-height:1.7" id="pv-bio1">—</div>
          <div class="editable" data-path="about.bio2" style="padding:12px;background:#111;border-radius:6px;margin-bottom:8px;cursor:pointer;font-size:14px;line-height:1.7" id="pv-bio2">—</div>
          <div class="editable" data-path="about.bio3" style="padding:12px;background:#111;border-radius:6px;cursor:pointer;font-size:14px;line-height:1.7" id="pv-bio3">—</div>
        </div>
        <div class="preview-section">
          <h2 class="section-label">🛠 技能</h2>
          <div id="preview-skills"></div>
          <button class="add-btn" onclick="addItem('about.skills')">+ 添加技能</button>
        </div>
        <div class="preview-section">
          <h2 class="section-label">💼 工作经历</h2>
          <div id="preview-experience"></div>
          <button class="add-btn" onclick="addItem('about.experience')">+ 添加</button>
        </div>
        <div class="preview-section">
          <h2 class="section-label">🏆 成就</h2>
          <div id="preview-achievements"></div>
          <button class="add-btn" onclick="addItem('about.achievements')">+ 添加</button>
        </div>
        <div class="preview-section">
          <h2 class="section-label">💬 评价</h2>
          <div id="preview-testimonials"></div>
          <button class="add-btn" onclick="addItem('about.testimonials')">+ 添加</button>
        </div>
      </div>

      <!-- Contact Tab -->
      <div class="cms-panel" id="panel-contact">
        <div class="preview-section">
          <h2 class="section-label">📧 邮箱</h2>
          <div class="editable" data-path="email" style="font-size:20px;padding:12px;background:#111;border-radius:6px;cursor:pointer;color:#c084fc" id="pv-email">—</div>
        </div>
        <div class="preview-section">
          <h2 class="section-label">🔗 社交链接</h2>
          <div id="preview-socials"></div>
          <button class="add-btn" onclick="addItem('socials')">+ 添加</button>
        </div>
        <div class="preview-section">
          <h2 class="section-label">🔑 管理密码</h2>
          <div class="editable" data-path="adminPassword" style="padding:12px;background:#111;border-radius:6px;cursor:pointer;font-size:14px;color:#888" id="pv-password">—</div>
        </div>
      </div>

      <!-- Files Tab -->
      <div class="cms-panel" id="panel-files">
        <div class="preview-section">
          <h2 class="section-label">📤 上传文件</h2>
          <input type="file" id="file-input" accept="image/*,video/*" multiple onchange="previewFiles()" style="color:#888;margin-bottom:8px" />
          <div id="file-preview" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"></div>
          <button class="add-btn" onclick="uploadFiles()">📤 开始上传</button>
        </div>
        <div class="preview-section">
          <h2 class="section-label">📂 已有文件（点击复制路径）</h2>
          <button class="add-btn" onclick="loadFileList()" style="margin-bottom:12px">🔄 刷新列表</button>
          <div id="existing-files" class="file-grid"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ====== Edit Modal ====== -->
<div class="admin-modal-overlay" id="edit-modal">
  <div class="admin-modal" style="max-width:600px;max-height:80vh;overflow-y:auto">
    <h3 id="edit-title">编辑</h3>
    <div id="edit-body"></div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn" onclick="saveEdit()">保存</button>
      <button class="btn" style="background:#333" onclick="closeEdit()">取消</button>
    </div>
  </div>
</div>

<!-- ====== Toast ====== -->
<div class="admin-toast" id="admin-toast"></div>

<script>
const OWNER='2240854970-jpg', REPO='portfolio', DATA_PATH='src/data/site-data.js', IMG_DIR='public/images/', BRANCH='main';
let siteData=null, dataSha='', gitToken='', dirty=false, editTarget=null, editCb=null;

// ── GitHub API ──
async function ghGet(path){
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{
    headers:{'Authorization':`Bearer ${gitToken}`,'Accept':'application/vnd.github+json'}
  });
  return r.ok?await r.json():null;
}
async function ghPut(path,content,msg,sha){
  const b64=btoa(unescape(encodeURIComponent(content)));
  const body={message:msg,content:b64,branch:BRANCH};
  if(sha) body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{
    method:'PUT',
    headers:{'Authorization':`Bearer ${gitToken}`,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  return r.ok?await r.json():null;
}
async function ghListDir(path){
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{
    headers:{'Authorization':`Bearer ${gitToken}`,'Accept':'application/vnd.github+json'}
  });
  return r.ok?await r.json():[];
}
function d64(b64){try{return decodeURIComponent(escape(atob(b64)));}catch{return atob(b64);}}

// ── Parse siteData ──
function parseData(raw){
  const m=raw.match(/export const siteData\s*=\s*({[\s\S]*?})\n\s*(?:export|$)/);
  if(!m) return null;
  try{return new Function('return '+m[1])();}catch(e){return null;}
}

// ── Get nested value by path like "about.bio1" ──
function getByPath(obj,path){
  return path.split('.').reduce((o,k)=>o?.[k],obj);
}
function setByPath(obj,path,val){
  const keys=path.split('.');
  let o=obj;
  for(let i=0;i<keys.length-1;i++){
    if(!o[keys[i]]) o[keys[i]]={};
    o=o[keys[i]];
  }
  o[keys[keys.length-1]]=val;
}

// ── Login ──
async function adminLogin(){
  gitToken=document.getElementById('admin-token').value;
  const pwd=document.getElementById('admin-pwd').value;
  const resp=await ghGet(DATA_PATH);
  if(!resp){toast('无法连接 GitHub','error');return;}
  const raw=d64(resp.content); dataSha=resp.sha;
  const sd=parseData(raw);
  if(!sd||sd.adminPassword!==pwd){document.getElementById('admin-error').style.display='block';return;}
  siteData=sd;
  document.getElementById('login-modal').style.display='none';
  document.getElementById('cms-root').style.display='block';
  renderAll();
}

// ── Render All ──
function renderAll(){
  const d=siteData;
  // Home
  document.getElementById('pv-name').textContent=d.name||'—';
  document.getElementById('pv-title').textContent=d.title||'—';
  document.getElementById('pv-tagline').textContent=d.tagline||'—';
  document.getElementById('pv-featured').textContent=(d.featuredWorkIds||[]).join(', ')||'点击编辑';
  document.getElementById('pv-footer').textContent=d.footer||'—';
  renderStats();
  renderHighlights();
  renderWorks();
  // About
  document.getElementById('pv-bio1').textContent=(d.about||{}).bio1||'—';
  document.getElementById('pv-bio2').textContent=(d.about||{}).bio2||'—';
  document.getElementById('pv-bio3').textContent=(d.about||{}).bio3||'—';
  renderSkills();
  renderExperience();
  renderAchievements();
  renderTestimonials();
  // Contact
  document.getElementById('pv-email').textContent=d.email||'—';
  document.getElementById('pv-password').textContent=d.adminPassword||'—';
  renderSocials();
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ── Stats ──
function renderStats(){
  const arr=siteData.stats||[];
  document.getElementById('preview-stats').innerHTML=arr.map((s,i)=>`
    <div class="stat-card">
      <span class="del" onclick="delArr('stats',${i})">✕</span>
      <div class="icon">${esc(s.icon)}</div>
      <div class="val editable" onclick="editArrItem('stats',${i},['value','label','icon'])">${esc(s.value)}</div>
      <div class="lbl editable" onclick="editArrItem('stats',${i},['value','label','icon'])">${esc(s.label)}</div>
    </div>`).join('');
}
// ── Highlights ──
function renderHighlights(){
  const arr=siteData.highlights||[];
  document.getElementById('preview-highlights').innerHTML=arr.map((h,i)=>`
    <div class="hl-card">
      <span class="del" onclick="delArr('highlights',${i})">✕</span>
      <div class="icon editable" onclick="editArrItem('highlights',${i},['icon','label','desc'])">${esc(h.icon)}</div>
      <div class="title editable" onclick="editArrItem('highlights',${i},['icon','label','desc'])">${esc(h.label)}</div>
      <div class="desc editable" onclick="editArrItem('highlights',${i},['icon','label','desc'])">${esc(h.desc)}</div>
    </div>`).join('');
}

// ── Works ──
function renderWorks(){
  const arr=siteData.works||[];
  document.getElementById('preview-works').innerHTML=arr.map((w,i)=>`
    <div class="work-card">
      ${w.thumbnail?`<img src="${esc(w.thumbnail)}" onerror="this.style.display='none'" />`:`<div style="width:60px;height:60px;background:#1a1a2a;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#444">🖼</div>`}
      <div class="info">
        <div class="wtitle">${esc(w.title)} <span style="font-size:11px;color:#${w.type==='video'?'f59e0b':'888'}">[${esc(w.type||'image')}]</span></div>
        <div class="wmeta">${esc(w.category||'')} · ${esc(w.date||'')} | 图片:${(w.images||[]).length}张</div>
      </div>
      <div class="wactions">
        <button onclick="editWork(${i})">✎ 编辑</button>
        <button class="del-btn" onclick="delArr('works',${i})">✕</button>
      </div>
    </div>`).join('');
}

// ── Skills ──
function renderSkills(){
  const arr=(siteData.about||{}).skills||[];
  document.getElementById('preview-skills').innerHTML=arr.map((s,i)=>`
    <div class="skill-bar">
      <div class="sname"><span>${esc(s.name)}</span><span>${Math.round((s.level||0)*100)}%</span></div>
      <div class="sbar"><div class="sfill" style="width:${Math.round((s.level||0)*100)}%"></div></div>
      <div style="margin-top:2px"><button style="background:none;border:none;color:#888;cursor:pointer;font-size:10px" onclick="editArrItem('about.skills',${i},['name','level'])">✎ 编辑</button> <button style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:10px" onclick="delArr('about.skills',${i})">✕</button></div>
    </div>`).join('');
}

// ── Experience ──
function renderExperience(){
  const arr=(siteData.about||{}).experience||[];
  document.getElementById('preview-experience').innerHTML=arr.map((e,i)=>`
    <div class="exp-card">
      <span class="del" onclick="delArr('about.experience',${i})">✕</span>
      <div style="font-size:12px;color:#c084fc;margin-bottom:4px">${esc(e.period)}</div>
      <div style="font-weight:600;font-size:14px;color:#ddd">${esc(e.role)} · ${esc(e.company)}</div>
      <div style="font-size:12px;color:#888;margin-top:4px;line-height:1.5">${esc(e.desc||'')}</div>

// ── Edit Simple Field ──

// ── Edit Array Item ──
function editArrItem(arrPath, index, keys){
  const arr=getByPath(siteData,arrPath);

  editTarget={type:'arrItem',path:arrPath,index:index,keys:keys};

  let html='';
  keys.forEach(k=>{

    html+=`<div class="edit-field"><label>${k}</label><input id="ev-${k}" value="${esc(String(val))}" /></div>`;
  });
  document.getElementById('edit-body').innerHTML=html;
  document.getElementById('edit-modal').classList.add('open');
}

// ── Edit Work (complex) ──

  const w=siteData.works[index];
  if(!w) return;
  editTarget={type:'work',index:index};
  document.getElementById('edit-title').textContent='编辑作品: '+w.title;
  let html='';
  [
    ['id','ID'],['title','标题'],['category','分类'],['type','类型(image/video)'],
    ['thumbnail','缩略图路径'],['bgGrad','背景渐变'],['videoUrl','视频链接'],

    html+=`<div class="edit-field"><label>${label}</label><input id="ew-${k}" value="${esc(w[k]||'')}" /></div>`;
  });
  html+=`<div class="edit-field"><label>工具（逗号分隔）</label><input id="ew-tools" value="${esc((w.tools||[]).join(', '))}" /></div>`;
  html+=`<div class="edit-field"><label>图片路径（逗号分隔）</label><textarea id="ew-images" rows="2">${esc((w.images||[]).join(', '))}</textarea></div>`;
  html+=`<div class="edit-field"><label>ShowCase 数量: ${(w.showCase||[]).length}（暂不支持直接编辑，需手动改 site-data.js）</label></div>`;
  document.getElementById('edit-body').innerHTML=html;
  document.getElementById('edit-modal').classList.add('open');
}

function saveEdit(){
  if(!editTarget) return;
  if(editTarget.type==='field'){
    const val=document.getElementById('edit-val').value;
    setByPath(siteData,editTarget.path,val);
    markDirty();
    renderAll();
    curTab();
  }else if(editTarget.type==='arrItem'){
    const arr=getByPath(siteData,editTarget.path);
    editTarget.keys.forEach(k=>{
      const v=document.getElementById('ev-'+k).value;
      // Try number conversion for level field
      if(k==='level') arr[editTarget.index][k]=parseFloat(v)||0;
      else arr[editTarget.index][k]=v;
    });
    markDirty();
    renderAll();
    curTab();
  }else if(editTarget.type==='work'){
    const w=siteData.works[editTarget.index];
    ['id','title','category','type','thumbnail','bgGrad','videoUrl','brief','role','date','achievement','designIntro','designResult'].forEach(k=>{
      w[k]=document.getElementById('ew-'+k).value;
    });
    w.tools=document.getElementById('ew-tools').value.split(',').map(s=>s.trim()).filter(Boolean);
    w.images=document.getElementById('ew-images').value.split(',').map(s=>s.trim()).filter(Boolean);
    markDirty();
    renderWorks();
  }
  closeEdit();
}
function closeEdit(){
  document.getElementById('edit-modal').classList.remove('open');
  editTarget=null;
}

// ── Serialize ──
function ser(obj,indent=0){
  const sp='  '.repeat(indent),sp2='  '.repeat(indent+1);
  if(obj===null) return 'null';
  if(typeof obj==='string') return "'"+obj.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n')+"'";
  if(typeof obj==='number'||typeof obj==='boolean') return String(obj);
  if(Array.isArray(obj)){
    if(obj.length===0) return '[]';
    if(obj.every(x=>typeof x!=='object'||x===null)) return '['+obj.map(x=>ser(x,0)).join(', ')+']';
    return '[\n'+obj.map(x=>sp2+ser(x,indent+1)).join(',\n')+'\n'+sp+']';
  }
  if(typeof obj==='object'){
    const keys=Object.keys(obj);
    if(keys.length===0) return '{}';
    return '{\n'+keys.map(k=>sp2+k+': '+ser(obj[k],indent+1)).join(',\n')+'\n'+sp+'}';
  }
  return String(obj);
}

async function saveAll(){
  const js='/**\n * ═══════════════════════════════════════\n * ★ 站点内容数据 ★\n * 由管理后台生成\n * ═══════════════════════════════════════\n */\n\nexport const siteData = '+ser(siteData,0)+';\n';
  toast('正在保存...');
  const result=await ghPut(DATA_PATH,js,'feat: 管理后台可视化编辑',dataSha);
  if(result){
    dataSha=result.content.sha;
    dirty=false;
    document.getElementById('dirty-badge').textContent='已保存 ✓';

  }else{
    toast('❌ 保存失败','error');
  }
}

// ── File Upload ──
let pendingFiles=[];
function previewFiles(){
  const input=document.getElementById('file-input');
  pendingFiles=Array.from(input.files);
  document.getElementById('file-preview').innerHTML=pendingFiles.map(f=>{
    const url=URL.createObjectURL(f);
    const isV=f.type.startsWith('video/');
    return `<div class="file-preview-item">${isV?`<video src="${url}" controls></video>`:`<img src="${url}" />`}<div class="name">${f.name}</div></div>`;
  }).join('');
}
async function uploadFiles(){
  if(pendingFiles.length===0){toast('请先选择文件','error');return;}
  toast('上传中...');
  let ok=0;
  for(const f of pendingFiles){
    const b64=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result.split(',')[1]);rd.readAsDataURL(f);});
    const path=IMG_DIR+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const result=await ghPut(path,b64,'upload: '+f.name);
    if(result) ok++; else toast('失败: '+f.name,'error');
  }
  if(ok>0){toast('✅ 成功 '+ok+' 个！','success');pendingFiles=[];document.getElementById('file-preview').innerHTML='';document.getElementById('file-input').value='';loadFileList();}
}
async function loadFileList(){
  const files=await ghListDir(IMG_DIR);
  if(!Array.isArray(files)) return;
  document.getElementById('existing-files').innerHTML=files.filter(f=>f.type==='file').map(f=>{
    const isV=f.name.match(/\.(mp4|webm|mov)$/i);
    return `<div class="file-item">${isV?`<video src="${f.download_url}" style="width:100px;height:100px;object-fit:cover;border-radius:4px;border:1px solid #333"></video>`:`<img src="${f.download_url}" loading="lazy" />`}<div class="fn" title="点击复制路径" onclick="copyPath('images/${f.name}')">images/${f.name}</div></div>`;
  }).join('');
}
function copyPath(p){navigator.clipboard.writeText(p).then(()=>toast('已复制: '+p));}

// ── Toast ──
function toast(msg,type=''){
  const el=document.getElementById('admin-toast');
  el.textContent=msg; el.className='admin-toast '+type; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),4000);
}
